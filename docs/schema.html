<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yantra Schema</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1f2328; --muted: #5d6670; --line: #d8dbe0;
    --accent: #2f5d8a; --accent-text: #ffffff; --code-bg: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --panel: #1f2227; --text: #e6e8eb; --muted: #9aa3ad; --line: #353a42;
      --accent: #6aa3d8; --accent-text: #0e1116; --code-bg: #2a2e35;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c; --panel: #1f2227; --text: #e6e8eb; --muted: #9aa3ad; --line: #353a42;
    --accent: #6aa3d8; --accent-text: #0e1116; --code-bg: #2a2e35;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { padding: 12px 16px 0; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .meta { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px; }
  nav button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px;
               padding: 6px 12px; font: inherit; cursor: pointer; }
  nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .bar { display: flex; align-items: center; gap: 8px; padding: 0 16px 8px; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 13px; flex: 1 1 260px; }
  .bar button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px;
                padding: 4px 10px; font: inherit; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .bar button[hidden] { display: none; }
  #stage { flex: 1; min-height: 360px; margin: 0 16px 12px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; overflow: hidden; position: relative; }
  #stage svg { width: 100%; height: 100%; max-width: none !important; }
  .status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 16px;
            text-align: center; }
  #tables { flex: 1; min-height: 360px; margin: 0 16px 12px; overflow-y: auto; }
  #tables[hidden], #stage[hidden] { display: none; }
  #tables section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
                    padding: 10px 12px; margin-bottom: 12px; }
  #tables h2 { font-size: 17px; margin: 0 0 4px; }
  #tables h3 { font-size: 13px; margin: 10px 0 4px; color: var(--muted); font-weight: 600; }
  #tables p { margin: 0 0 6px; }
  .table-box { overflow-x: auto; max-width: 100%; }
  table { border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; }
  th { background: var(--bg); font-weight: 600; white-space: nowrap; }
  td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: nowrap; }
  td.wide { min-width: 240px; }
  .none { color: var(--muted); font-size: 13px; margin: 0 0 4px; }
  footer { color: var(--muted); font-size: 12px; padding: 0 16px 12px; }
  code { font-size: 12px; background: var(--code-bg); padding: 0 3px; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>Yantra database schema</h1>
  <div class="meta" id="meta"></div>
</header>
<nav id="tabs" role="tablist"></nav>
<div class="bar">
  <span class="note" id="note"></span>
  <button type="button" id="show-diagram" aria-pressed="true">Show diagram</button>
  <button type="button" id="show-tables" aria-pressed="false">Show tables</button>
  <button type="button" id="zoom-in">Zoom in</button>
  <button type="button" id="zoom-out">Zoom out</button>
  <button type="button" id="fit">Fit to screen</button>
</div>
<div id="stage"></div>
<div id="tables" hidden></div>
<footer>Drag to move, scroll or pinch to zoom. The diagram needs internet for its drawing library; the tables do not. Data: <code>docs/schema/schema.json</code>, made by <code>tooling\schema-docs.bat</code>.</footer>

<!-- The data and the pure functions: classic scripts by relative path, so the page works from disk (file://) -->
<script src="schema/schema-data.js"></script>
<script src="schema/schema-view.js"></script>
<script>
(function () {
  "use strict";
  var MERMAID_URL = "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  var PAN_ZOOM_URL = "https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js";
  var TAB_KEY = "yantra-schema-tab";
  var VIEW_KEY = "yantra-schema-view";

  var schema = window.YANTRA_SCHEMA;
  var notes = window.YANTRA_SCHEMA_NOTES;
  var view = window.YantraSchemaView;

  var stage = document.getElementById("stage");
  var tablesEl = document.getElementById("tables");
  var tabsEl = document.getElementById("tabs");
  var noteEl = document.getElementById("note");
  var diagramButton = document.getElementById("show-diagram");
  var tablesButton = document.getElementById("show-tables");
  var zoomButtons = ["zoom-in", "zoom-out", "fit"].map(function (id) { return document.getElementById(id); });

  function el(tag, text, className) {
    var node = document.createElement(tag);
    if (text !== undefined && text !== null) node.textContent = String(text);
    if (className) node.className = className;
    return node;
  }

  function showStatus(message) {
    stage.replaceChildren(el("div", message, "status"));
  }

  if (!schema || !notes || !view) {
    stage.hidden = false;
    showStatus("The schema data was not found. The file docs/schema/schema-data.js is missing or broken. " +
               "Run tooling\\schema-docs.bat write, then reload this page.");
    diagramButton.hidden = tablesButton.hidden = true;
    zoomButtons.forEach(function (b) { b.hidden = true; });
    return;
  }

  document.getElementById("meta").textContent = view.metaLine(schema);
  var tabNames = view.tabs(notes);

  function recall(key, fallback, allowed) {
    try { var v = localStorage.getItem(key); return allowed.indexOf(v) >= 0 ? v : fallback; }
    catch (e) { return fallback; }
  }
  function remember(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* storage blocked */ }
  }

  var currentTab = recall(TAB_KEY, view.OVERVIEW, tabNames);
  var currentView = recall(VIEW_KEY, "diagram", ["diagram", "tables"]);
  var panZoom = null;
  var mermaidPromise = null;
  var drawCount = 0;

  function dark() {
    var forced = document.documentElement.dataset.theme;
    return forced ? forced === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  }

  // Loaded on the first drawing, not by a static import: an offline page still shows the tables
  // svg-pan-zoom is loaded here too, not by a script tag: a tag would block the page while the
  // network drops packets to the CDN, and the draw needs both libraries anyway
  function loadPanZoom() {
    if (window.svgPanZoom) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var script = document.createElement("script");
      script.src = PAN_ZOOM_URL;
      script.onload = resolve;
      script.onerror = function () { script.remove(); reject(new Error("svg-pan-zoom did not load")); };
      document.head.appendChild(script);
    });
  }

  function loadMermaid() {
    if (!mermaidPromise) {
      mermaidPromise = Promise.all([import(MERMAID_URL), loadPanZoom()]).then(function (loaded) {
        var mermaid = loaded[0].default;
        mermaid.initialize({ startOnLoad: false, theme: dark() ? "dark" : "default", er: { useMaxWidth: false },
                             maxTextSize: 200000, securityLevel: "strict" });
        return mermaid;
      });
      mermaidPromise.catch(function () { mermaidPromise = null; });
    }
    return mermaidPromise;
  }

  function fit() {
    if (panZoom) { panZoom.resize(); panZoom.fit(); panZoom.center(); }
  }

  async function drawDiagram() {
    var tab = currentTab;
    var ticket = ++drawCount;
    if (panZoom) { panZoom.destroy(); panZoom = null; }
    showStatus("Drawing…");
    try {
      var mermaid = await loadMermaid();
      var result = await mermaid.render("er" + ticket + "_" + Date.now(), view.diagramSource(schema, notes, tab));
      if (ticket !== drawCount || currentView !== "diagram") return;   // another tab or view was chosen meanwhile
      stage.innerHTML = result.svg;   // Mermaid's own output (securityLevel strict), never the data itself
      var svg = stage.querySelector("svg");
      svg.removeAttribute("style");
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");
      panZoom = svgPanZoom(svg, { controlIconsEnabled: false, zoomScaleSensitivity: 0.3, minZoom: 0.1, maxZoom: 20 });
      fit();
    } catch (err) {
      if (ticket !== drawCount) return;
      showStatus("The diagram could not be drawn. Check the internet connection, then reload the page. " +
                 "The tables work without internet: select Show tables.");
      console.error(err);
    }
  }

  // ---- The Tables view -------------------------------------------------------------------

  function holdsInto(node, text) {
    view.holdsParts(text || "").forEach(function (part) {
      node.appendChild(part.kind === "text" ? document.createTextNode(part.text)
                                            : el(part.kind === "code" ? "code" : "em", part.text));
    });
    return node;
  }

  // rows: arrays of cells; a cell is a string, or {text, className}, or {holds} for a holds text
  function smallTable(headings, rows) {
    if (!rows.length) return el("p", "None", "none");
    var table = el("table");
    var head = el("tr");
    headings.forEach(function (h) { head.appendChild(el("th", h)); });
    table.appendChild(el("thead")).appendChild(head);
    var body = table.appendChild(el("tbody"));
    rows.forEach(function (row) {
      var tr = body.appendChild(el("tr"));
      row.forEach(function (cell) {
        if (cell && typeof cell === "object" && "holds" in cell) tr.appendChild(holdsInto(el("td", null, "wide"), cell.holds));
        else if (cell && typeof cell === "object") tr.appendChild(el("td", cell.text, cell.className));
        else tr.appendChild(el("td", cell));
      });
    });
    var box = el("div", null, "table-box");
    box.appendChild(table);
    return box;
  }

  function yesNo(value) { return value ? "Yes" : "No"; }
  function mono(text) { return { text: text, className: "mono" }; }
  function notesEntry(name) { return (notes.tables && notes.tables[name]) || {}; }

  function tableSection(name) {
    var table = schema.tables[name];
    var section = el("section");
    section.appendChild(el("h2", name));
    section.appendChild(holdsInto(el("p"), notesEntry(name).holds));
    section.appendChild(el("h3", "Columns"));
    section.appendChild(smallTable(["Column", "Type", "Empty allowed", "Default", "Key", "Extra"],
      table.columns.map(function (c) {
        return [mono(c.name), mono(c.type), yesNo(c.null), mono(c.default === null ? "" : c.default), c.key, c.extra];
      })));
    section.appendChild(el("h3", "Indexes"));
    section.appendChild(smallTable(["Name", "Unique", "Columns"], table.indexes.map(function (ix) {
      return [mono(ix.name), yesNo(ix.unique), mono(ix.columns.join(", "))];
    })));
    section.appendChild(el("h3", "Foreign keys"));
    section.appendChild(smallTable(["Name", "Columns", "Points to", "Required"], table.foreign_keys.map(function (fk) {
      return [mono(fk.name), mono(fk.columns.join(", ")), mono(fk.references + " (" + fk.ref_columns.join(", ") + ")"),
              yesNo(fk.required)];
    })));
    section.appendChild(el("h3", "Checks"));
    section.appendChild(smallTable(["Name", "Rule"], table.checks.map(function (ck) {
      return [mono(ck.name), mono(ck.clause)];
    })));
    return section;
  }

  function overviewTables() {
    var known = notes.areas.map(function (a) { return a.name; });
    var parts = [];
    var all = el("section");
    all.appendChild(el("h2", "All tables"));
    all.appendChild(smallTable(["Table", "Area", "Holds"], Object.keys(schema.tables).sort().map(function (name) {
      var entry = notesEntry(name);
      return [mono(name), known.indexOf(entry.area) >= 0 ? entry.area : "No area", { holds: entry.holds }];
    })));
    parts.push(all);
    var planned = el("section");
    planned.appendChild(el("h2", "Planned tables (not built yet)"));
    planned.appendChild(holdsInto(el("p"), notes.planned_note));
    planned.appendChild(smallTable(["Tables", "Holds"], (notes.planned || []).map(function (group) {
      return [mono(group.tables.join(", ")), { holds: group.holds }];
    })));
    parts.push(planned);
    return parts;
  }

  function drawTables() {
    var parts = currentTab === view.OVERVIEW ? overviewTables()
      : view.areaTables(schema, notes, currentTab).own.map(tableSection);
    tablesEl.replaceChildren.apply(tablesEl, parts);
    tablesEl.scrollTop = 0;
  }

  // ---- Tabs and views --------------------------------------------------------------------

  function noteOf(tab) {
    if (tab === view.OVERVIEW) return notes.overview_note || "";
    var area = notes.areas.filter(function (a) { return a.name === tab; })[0];
    return area ? area.note : "";
  }

  function render() {
    [].forEach.call(tabsEl.children, function (b) { b.setAttribute("aria-selected", String(b.textContent === currentTab)); });
    noteEl.textContent = noteOf(currentTab);
    var diagram = currentView === "diagram";
    diagramButton.setAttribute("aria-pressed", String(diagram));
    tablesButton.setAttribute("aria-pressed", String(!diagram));
    zoomButtons.forEach(function (b) { b.hidden = !diagram; });
    stage.hidden = !diagram;
    tablesEl.hidden = diagram;
    if (diagram) { drawDiagram(); } else { drawTables(); }
  }

  tabNames.forEach(function (name) {
    var b = el("button", name);
    b.type = "button";
    b.setAttribute("role", "tab");
    b.addEventListener("click", function () { currentTab = name; remember(TAB_KEY, name); render(); });
    tabsEl.appendChild(b);
  });
  diagramButton.addEventListener("click", function () { currentView = "diagram"; remember(VIEW_KEY, "diagram"); render(); });
  tablesButton.addEventListener("click", function () { currentView = "tables"; remember(VIEW_KEY, "tables"); render(); });
  zoomButtons[0].addEventListener("click", function () { if (panZoom) panZoom.zoomIn(); });
  zoomButtons[1].addEventListener("click", function () { if (panZoom) panZoom.zoomOut(); });
  zoomButtons[2].addEventListener("click", fit);
  addEventListener("resize", fit);
  render();
})();
</script>
</body>
</html>
