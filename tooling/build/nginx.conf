server {
    listen 80;
    server_name _;

    # Requests arrive via the front reverse proxy (app zone, 10.24.0.0/23 —
    # matches the devops zone-app list). Take the client address from its
    # X-Forwarded-For so $remote_addr, and hence the X-Real-IP we send to the
    # backend, is the real client and not the proxy. Addresses outside the
    # trusted range are used as-is, so a client cannot forge its own IP.
    set_real_ip_from 10.24.0.0/23;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets — long cache with immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy — forward to backend container
    location /api/ {
        # Docker's DNS, so a recreated backend container (new address) is found again
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upload limit setting max (100 MB) plus multipart overhead; Flask's MAX_CONTENT_LENGTH matches
        client_max_body_size 101M;
    }

    # SPA fallback — serve index.html for all non-file routes.
    # index.html must never be cached: it is the only file whose URL does not
    # change between builds, so a stale copy pins the client to the old
    # /assets/ bundle (which is immutable for a year). "no-cache" means
    # "revalidate every time", not "don't store" — the ETag makes it a 304.
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache" always;
        # add_header does not inherit once redefined at this level — repeat them
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
